[project]
name = "gpu-share"
version = "0.1.0"
description = "Rent or share GPU capacity with instant Solana payments."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "PyJWT>=2.9",
    "PyNaCl>=1.5",
    "base58>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyinstaller>=6.0",
]

# One root project covers all Python code: services/api, services/worker, payments.
[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
